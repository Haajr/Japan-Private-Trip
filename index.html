<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Japan Honeymoon — Travel Guide</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      background-color: #e9dec9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    .page-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 32px;
      gap: 24px;
    }
    .poster-section {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .poster-img {
      width: 100%;
      height: auto;
      max-height: 94vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: block;
    }
    @media (max-width: 480px) {
      .page-container {
        padding: 10px 6px 24px;
        gap: 16px;
      }
      .poster-img {
        max-height: 96vh;
        border-radius: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <section class="poster-section">
      <img src="cover.png" alt="Japan Honeymoon Travel Guide, 29 Nov - 18 Dec 2026" class="poster-img" />
    </section>
    <section class="poster-section">
      <img src="route.jpg" alt="Japan Trip Route & Itinerary Poster" class="poster-img" />
    </section>
  </div>
</body>
</html>
