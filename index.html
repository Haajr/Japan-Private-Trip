<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Japan Honeymoon — رحلة اليابان الخاصة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-canvas: #f2eee3;
      --navy-main: #132238;
      --vermilion: #c9432d;
      --card-cream: #faf7f0;
      --border-soft: rgba(19, 34, 56, 0.08);
      --poster-radius: 12px;
      --poster-shadow: 0 12px 36px rgba(19, 34, 56, 0.12);
    }

    body {
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(circle at 100% 100%, rgba(201, 67, 45, 0.035) 0%, transparent 40%),
        radial-gradient(circle at 0% 0%, rgba(19, 34, 56, 0.035) 0%, transparent 40%),
        url("data:image/svg+xml,%3Csvg width='36' height='36' viewBox='0 0 36 36' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M18 0L36 18L18 36L0 18z' fill='%23132238' fill-opacity='0.02' fill-rule='evenodd'/%3E%3C/svg%3E");
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--navy-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px 60px;
    }

    /* Container matching all 3 poster pages */
    .posters-deck {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* Poster Frame — identical across all 3 pages */
    .poster-frame {
      width: 100%;
      border-radius: var(--poster-radius);
      box-shadow: var(--poster-shadow);
      background: #fdfaf4;
      border: 1px solid rgba(255, 255, 255, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .poster-img {
      width: 100%;
      height: auto;
      max-height: 94vh;
      object-fit: contain;
      display: block;
    }

    /* Page 3: Needs Poster Canvas */
    .needs-canvas {
      padding: 34px 22px 30px;
      background: linear-gradient(180deg, #fdfbf7 0%, #f7f3e8 100%);
      position: relative;
    }

    .needs-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .tag-seal {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--vermilion);
      background: rgba(201, 67, 45, 0.08);
      border: 1px solid rgba(201, 67, 45, 0.2);
      padding: 3px 12px;
      border-radius: 14px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .needs-title {
      font-size: 1.85rem;
      font-weight: 900;
      color: var(--navy-main);
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .needs-subtitle {
      font-size: 0.98rem;
      font-weight: 500;
      color: #61728a;
    }

    /* Gallery within Needs Canvas */
    .mini-gallery {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Desktop Rows */
    .row-four, .row-three {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    /* Mini Poster Cards */
    .mini-card {
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      width: 120px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(19, 34, 56, 0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      user-select: none;
    }

    .mini-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 22px rgba(19, 34, 56, 0.14);
    }

    .mini-card:active {
      transform: scale(0.97);
    }

    .mini-img-wrap {
      width: 100%;
      aspect-ratio: 128 / 191;
      background: #eee8d8;
      overflow: hidden;
    }

    .mini-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .mini-info {
      background: #fff;
      padding: 8px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(19, 34, 56, 0.05);
    }

    .mini-name {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--navy-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-arrow {
      font-size: 0.7rem;
      color: #8b99ac;
      transition: transform 0.2s, color 0.2s;
    }

    .mini-card:hover .mini-arrow {
      transform: translateX(-2px);
      color: var(--vermilion);
    }

    /* Modal / Bottom Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(19, 34, 56, 0.52);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
      z-index: 2000;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 18px;
      width: 100%;
      max-width: 400px;
      padding: 24px 20px;
      box-shadow: 0 20px 44px rgba(19, 34, 56, 0.2);
      transform: translateY(16px) scale(0.97);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0) scale(1);
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0e9dc;
    }

    .modal-top h3 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--navy-main);
    }

    .close-btn {
      background: #f4ede2;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--navy-main);
    }

    .modal-content {
      padding: 24px 12px;
      text-align: center;
      color: #64748b;
      font-size: 1rem;
      background: #faf6f0;
      border-radius: 10px;
      border: 1px dashed #e2d7c5;
    }

    /* Mobile specific adjustments */
    @media (max-width: 580px) {
      body {
        padding: 12px 8px 48px;
      }

      .posters-deck {
        gap: 18px;
      }

      .poster-frame {
        border-radius: 10px;
      }

      .needs-canvas {
        padding: 24px 14px 24px;
      }

      .needs-title {
        font-size: 1.55rem;
      }

      .needs-subtitle {
        font-size: 0.9rem;
      }

      /* 2 cards per row on mobile, last centered */
      .mini-gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .row-four, .row-three {
        display: contents;
      }

      .mini-card {
        width: 100%;
        border-radius: 10px;
      }

      .mini-card:nth-child(7) {
        grid-column: 1 / span 2;
        max-width: 160px;
        margin: 0 auto;
      }

      .mini-name {
        font-size: 0.78rem;
      }

      /* Bottom sheet on mobile */
      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .modal-box {
        max-width: 100%;
        border-radius: 20px 20px 0 0;
        padding: 20px 16px 32px;
        transform: translateY(100%);
      }

      .modal-overlay.active .modal-box {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <main class="posters-deck">
    <!-- الصفحة 1: بوستر الغلاف -->
    <article class="poster-frame">
      <img src="cover.png" alt="Japan Honeymoon Travel Guide" class="poster-img" />
    </article>

    <!-- الصفحة 2: بوستر مسار وأيام الرحلة -->
    <article class="poster-frame">
      <img src="route.jpg" alt="Japan Trip Route Poster" class="poster-img" />
    </article>

    <!-- الصفحة 3: لوحة احتياجات الرحلة المتطابقة في المقاس والأبعاد -->
    <article class="poster-frame needs-canvas">
      <header class="needs-header">
        <span class="tag-seal">Trip Essentials</span>
        <h2 class="needs-title">احتياجات الرحلة</h2>
        <p class="needs-subtitle">كل ما تحتاجه لرحلتك إلى اليابان</p>
      </header>

      <div class="mini-gallery">
        <!-- الصف الأول: 4 بطاقات -->
        <div class="row-four">
          <div class="mini-card" onclick="openModal('إجراءات الدخول')">
            <div class="mini-img-wrap">
              <img src="cards/card_1.png" alt="إجراءات الدخول" loading="lazy">
            </div>
            <div class="mini-info">
              <span class="mini-name">إجراءات الدخول</span>
              <span class="mini-arrow">←</span>
            </div>
          </div>

          <div class="mini-card" onclick="openModal('أهم التطبيقات')">
            <div class="mini-img-wrap">
              <img src="cards/card_2.png" alt="أهم التطبيقات" loading="lazy">
            </div>
            <div class="mini-info">
              <span class="mini-name">أهم التطبيقات</span>
              <span class="mini-arrow">←</span>
            </div>
          </div>

          <div class="mini-card" onclick="openModal('الإنترنت وeSIM')">
            <div class="mini-img-wrap">
              <img src="cards/card_3.png" alt="الإنترنت وeSIM" loading="lazy">
            </div>
            <div class="mini-info">
              <span class="mini-name">الإنترنت وeSIM</span>
              <span class="mini-arrow">←</span>
            </div>
          </div>

          <div class="mini-card" onclick="openModal('الدفع والكاش')">
            <div class="mini-img-wrap">
              <img src="cards/card_4.png" alt="الدفع والكاش" loading="lazy">
            </div>
            <div class="mini-info">
              <span class="mini-name">الدفع والكاش</span>
              <span class="mini-arrow">←</span>
            </div>
          </div>
        </div>

        <!-- الصف الثاني: 3 بطاقات في المنتصف -->
        <div class="row-three">
          <div class="mini-card" onclick="openModal('المواصلات وSuica')">
            <div class="mini-img-wrap">
              <img src="cards/card_5.png" alt="المواصلات وSuica" loading="lazy">
            </div>
            <div class="mini-info">
              <span class="mini-name">المواصلات وSuica</span>
              <span class="mini-arrow">←</span>
            </div>
          </div>

          <div class="mini-card" onclick="openModal('الكهرباء والتجهيزات')">
            <div class="mini-img-wrap">
              <img src="cards/card_6.png" alt="الكهرباء والتجهيزات" loading="lazy">
            </div>
            <div class="mini-info">
              <span class="mini-name">الكهرباء والتجهيزات</span>
              <span class="mini-arrow">←</span>
            </div>
          </div>

          <div class="mini-card" onclick="openModal('البقالة اليابانية')">
            <div class="mini-img-wrap">
              <img src="cards/card_7.png" alt="البقالة اليابانية" loading="lazy">
            </div>
            <div class="mini-info">
              <span class="mini-name">البقالة اليابانية</span>
              <span class="mini-arrow">←</span>
            </div>
          </div>
        </div>
      </div>
    </article>
  </main>

  <!-- Modal / Bottom Sheet -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal-box">
      <div class="modal-top">
        <h3 id="modalTitle">عنوان القسم</h3>
        <button class="close-btn" onclick="closeModal()" aria-label="إغلاق">✕</button>
      </div>
      <div class="modal-content">
        ستُضاف معلومات هذا القسم هنا
      </div>
    </div>
  </div>

  <script>
    function openModal(title) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'modalOverlay') {
        closeModal();
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    });
  </script>
</body>
</html>
