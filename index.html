<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Japan Honeymoon — Travel Guide</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      background-color: #e9dec9;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    .poster-container {
      width: 100%;
      max-width: 600px;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .poster-img {
      width: 100%;
      height: auto;
      max-height: 96vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: block;
    }
    @media (max-width: 480px) {
      .poster-container {
        padding: 6px;
      }
      .poster-img {
        max-height: 98vh;
        border-radius: 4px;
      }
    }
  </style>
</head>
<body>
  <main class="poster-container">
    <img src="cover.png" alt="Japan Honeymoon Travel Guide, 29 Nov - 18 Dec 2026" class="poster-img" />
  </main>
</body>
</html>
