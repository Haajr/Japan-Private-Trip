<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>احتياجات الرحلة — كل ما تحتاجه لرحلتك إلى اليابان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-cream: #f9f5ec;
      --card-bg: #ffffff;
      --card-cream: #faf5ed;
      --text-navy: #152542;
      --text-muted: #64748b;
      --border-color: #eee5d5;
      --shadow-sm: 0 4px 14px rgba(21, 37, 66, 0.06);
      --shadow-hover: 0 14px 28px rgba(21, 37, 66, 0.14);
      --primary-navy: #152542;
    }

    body {
      background-color: var(--bg-cream);
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 80px;
    }

    /* Header */
    .header-container {
      text-align: center;
      max-width: 680px;
      margin-bottom: 44px;
    }

    .main-title {
      font-size: 2.3rem;
      font-weight: 800;
      color: var(--text-navy);
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 1.15rem;
      font-weight: 500;
      color: #55657e;
      line-height: 1.6;
    }

    /* Gallery Grid */
    .gallery-container {
      width: 100%;
      max-width: 980px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Desktop Layout: row 1 (4 cards), row 2 (3 cards centered) */
    .row-four, .row-three {
      display: flex;
      justify-content: center;
      gap: 24px;
      width: 100%;
    }

    /* Card styling */
    .poster-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      width: 210px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.28s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.28s cubic-bezier(0.2, 0, 0.2, 1);
      user-select: none;
    }

    .poster-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
    }

    .poster-card:active {
      transform: scale(0.98);
    }

    .card-image-wrap {
      width: 100%;
      background: #f1ebd9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      aspect-ratio: 128 / 191;
    }

    .card-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .poster-card:hover .card-image-wrap img {
      transform: scale(1.03);
    }

    .card-info {
      background-color: var(--card-cream);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #efe6d8;
    }

    .card-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-navy);
    }

    .card-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(21, 37, 66, 0.06);
      color: var(--text-navy);
      font-size: 0.85rem;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .poster-card:hover .card-arrow {
      transform: translateX(-3px);
      background: var(--text-navy);
      color: #fff;
    }

    /* Modal / Bottom Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(19, 34, 56, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      transform: translateY(20px) scale(0.96);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0e9dd;
    }

    .modal-header h3 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-navy);
    }

    .close-btn {
      background: #f3ede2;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--text-navy);
      transition: background 0.2s, transform 0.2s;
    }

    .close-btn:hover {
      background: #e8dece;
      transform: rotate(90deg);
    }

    .modal-body {
      padding: 24px 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 1.1rem;
      background: #faf6f0;
      border-radius: 12px;
      border: 1px dashed #e4d8c4;
    }

    /* Back link button */
    .nav-back {
      margin-top: 50px;
      text-align: center;
    }

    .nav-back a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-navy);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      background: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }

    .nav-back a:hover {
      background: var(--text-navy);
      color: #fff;
      transform: translateY(-2px);
    }

    /* Mobile Responsive View */
    @media (max-width: 768px) {
      body {
        padding: 28px 14px 60px;
      }

      .main-title {
        font-size: 1.85rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      /* On mobile: 2 cards per row, last card centered */
      .gallery-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        max-width: 440px;
      }

      .row-four, .row-three {
        display: contents; /* flat inside grid */
      }

      .poster-card {
        width: 100%;
        border-radius: 12px;
      }

      /* 7th card alone in the middle */
      .poster-card:nth-child(7) {
        grid-column: 1 / span 2;
        max-width: 200px;
        margin: 0 auto;
      }

      .card-info {
        padding: 10px 12px;
      }

      .card-title {
        font-size: 0.9rem;
      }

      .card-arrow {
        width: 20px;
        height: 20px;
        font-size: 0.75rem;
      }

      /* Mobile Drawer / Bottom Sheet */
      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .modal-card {
        max-width: 100%;
        border-radius: 24px 24px 0 0;
        padding: 24px 20px 36px;
        transform: translateY(100%);
      }

      .modal-overlay.active .modal-card {
        transform: translateY(0);
      }
    }

    .modal-card { max-height: 88vh; }
    .modal-body.filled { text-align: right; color: var(--text-navy); font-size: 1rem; line-height: 1.8;
      background: #faf6f0; border: 1px solid #efe6d6; padding: 16px 18px; overflow-y: auto; }
    .modal-body.filled h4 { font-size: 1.02rem; font-weight: 800; margin: 14px 0 6px; }
    .modal-body.filled h4:first-child { margin-top: 0; }
    .modal-body.filled ul, .modal-body.filled ol { padding-right: 20px; margin: 0 0 6px; }
    .modal-body.filled li { margin-bottom: 4px; }
    .modal-body.filled .note { background: #fff; border-radius: 10px; padding: 10px 12px; margin-top: 10px;
      border-right: 4px solid #b5322b; font-size: 0.95rem; }
    .modal-body.filled bdi { font-weight: 700; }
    .modal-body.filled a { color: #b5322b; font-weight: 700; }
  </style>
</head>
<body>

  <header class="header-container">
    <h1 class="main-title">احتياجات الرحلة</h1>
    <p class="subtitle">كل ما تحتاجه لرحلتك إلى اليابان</p>
  </header>

  <main class="gallery-container">
    <!-- الصف الأول: 4 بطاقات -->
    <div class="row-four">
      <!-- البطاقة 1 -->
      <article class="poster-card" onclick="openModal('إجراءات الدخول')">
        <div class="card-image-wrap">
          <img src="cards/card_1.png" alt="إجراءات الدخول" loading="lazy">
        </div>
        <div class="card-info">
          <span class="card-title">إجراءات الدخول</span>
          <span class="card-arrow">←</span>
        </div>
      </article>

      <!-- البطاقة 2 -->
      <article class="poster-card" onclick="openModal('أهم التطبيقات')">
        <div class="card-image-wrap">
          <img src="cards/card_2.png" alt="أهم التطبيقات" loading="lazy">
        </div>
        <div class="card-info">
          <span class="card-title">أهم التطبيقات</span>
          <span class="card-arrow">←</span>
        </div>
      </article>

      <!-- البطاقة 3 -->
      <article class="poster-card" onclick="openModal('الإنترنت وeSIM')">
        <div class="card-image-wrap">
          <img src="cards/card_3.png" alt="الإنترنت وeSIM" loading="lazy">
        </div>
        <div class="card-info">
          <span class="card-title">الإنترنت و&#8239;<bdi>eSIM</bdi></span>
          <span class="card-arrow">←</span>
        </div>
      </article>

      <!-- البطاقة 4 -->
      <article class="poster-card" onclick="openModal('الدفع والكاش')">
        <div class="card-image-wrap">
          <img src="cards/card_4.png" alt="الدفع والكاش" loading="lazy">
        </div>
        <div class="card-info">
          <span class="card-title">الدفع والكاش</span>
          <span class="card-arrow">←</span>
        </div>
      </article>
    </div>

    <!-- الصف الثاني: 3 بطاقات في المنتصف -->
    <div class="row-three">
      <!-- البطاقة 5 -->
      <article class="poster-card" onclick="openModal('المواصلات وSuica')">
        <div class="card-image-wrap">
          <img src="cards/card_5.png" alt="المواصلات وSuica" loading="lazy">
        </div>
        <div class="card-info">
          <span class="card-title">المواصلات و&#8239;<bdi>Suica</bdi></span>
          <span class="card-arrow">←</span>
        </div>
      </article>

      <!-- البطاقة 6 -->
      <article class="poster-card" onclick="openModal('الكهرباء والتجهيزات')">
        <div class="card-image-wrap">
          <img src="cards/card_6.png" alt="الكهرباء والتجهيزات" loading="lazy">
        </div>
        <div class="card-info">
          <span class="card-title">الكهرباء والتجهيزات</span>
          <span class="card-arrow">←</span>
        </div>
      </article>

      <!-- البطاقة 7 -->
      <article class="poster-card" onclick="openModal('البقالة اليابانية')">
        <div class="card-image-wrap">
          <img src="cards/card_7.png" alt="البقالة اليابانية" loading="lazy">
        </div>
        <div class="card-info">
          <span class="card-title">البقالة اليابانية</span>
          <span class="card-arrow">←</span>
        </div>
      </article>
    </div>
  </main>

  <div class="nav-back">
    <a href="index.html">
      <span>العودة لبوسترات الرحلة</span>
      <span>→</span>
    </a>
  </div>

  <!-- نافذة المعاينة (Modal / Bottom Sheet) -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">عنوان القسم</h3>
        <button class="close-btn" onclick="closeModal()" aria-label="إغلاق">✕</button>
      </div>
      <div class="modal-body">
        ستُضاف معلومات هذا القسم هنا
      </div>
    </div>
  </div>

  <script>
    const SECTIONS = {"إجراءات الدخول": "<h4>قبل السفر بأسبوع</h4><ul>\n<li>تأكدوا إن الجواز صالح ومن متطلبات التأشيرة.</li>\n<li>جهزوا بيانات الرحلة والفندق اللي بنعطيكم إياها.</li>\n<li>كمّلوا إجراءات الدخول والجمارك في موقع <bdi>Visit Japan Web</bdi> الرسمي، وجهزوا رمز <bdi>QR</bdi> لكل مسافر.</li></ul>\n<h4>بعد النزول في مطار ناريتا (المبنى 2)</h4><ol>\n<li>اتبعوا اللوحات الصفراء <bdi>Arrivals</bdi>، ولا تروحون لـ <bdi>International Transfer</bdi>.</li>\n<li>كمّلوا لين توصلون لوحة <bdi>Immigration</bdi>.</li>\n<li>جهزوا الجواز ورمز <bdi>Visit Japan Web</bdi> لكل شخص، واتبعوا الموظف للبصمة والصورة.</li>\n<li>بعد الجوازات انزلوا الدور 1 واتبعوا <bdi>Baggage Claim</bdi>، وشوفوا رقم السير على الشاشة باسم شركة الطيران ورقم الرحلة.</li></ol>", "أهم التطبيقات": "<ul>\n<li><bdi>Didi</bdi> — للمواصلات وطلب السيارات.</li>\n<li><bdi>Klook</bdi> — للتذاكر والحجوزات.</li>\n<li><bdi>Tokyo Disney Resort App</bdi> — لديزني.</li>\n<li><bdi>Universal Studios Japan App</bdi> — ليونيفرسال.</li>\n<li><bdi>Halal Gourmet Japan</bdi> — تسوون سكان لمنتجات البقالة تتأكدون إنها حلال، وتلقون المطاعم الحلال.</li></ul>\n<div class=\"note\">حمّلوا التطبيقات وسجّلوا فيها قبل السفر.</div>", "الإنترنت وeSIM": "<h4>قبل السفر</h4><ol>\n<li>حمّلوا واحد من التطبيقين: <bdi>Airalo</bdi> أو <bdi>Holafly</bdi>.</li>\n<li>اختاروا <bdi>Japan eSIM</bdi> والباقة اللي تكفي مدة الرحلة.</li>\n<li>ثبّتوا الشريحة على الجوال قبل السفر.</li></ol>\n<div class=\"note\">إذا ما اشتغل النت عند الوصول، اتصلوا بشبكة <bdi>Wi-Fi</bdi> المجانية في المطار.</div>", "الدفع والكاش": "<ul>\n<li>بعد الجوازات واستلام الشنط والجمارك تطلعون على <bdi>Arrival Lobby</bdi>.</li>\n<li>دوروا علامة <bdi>ATM / Cash Service</bdi> واسحبوا مبلغ للطوارئ.</li>\n<li>بطاقة <bdi>Suica</bdi> بعد تنفع للدفع في كثير من المحلات وأجهزة البيع.</li></ul>", "المواصلات وSuica": "<p>بطاقة مواصلات تنشحن، تريحكم من شراء تذكرة لكل مشوار.</p><ul>\n<li>تنفع للقطارات والمترو والباصات.</li>\n<li>مرّروها على بوابة <bdi>IC</bdi> عند الدخول والخروج وتنخصم الأجرة لحالها.</li>\n<li>تطلعونها من مطار ناريتا إذا عندكم وقت، أو بعدين من محطات القطار.</li>\n<li>كل شخص يحتاج بطاقة لحاله.</li></ul>\n<h4>طريقة الشراء من الجهاز</h4>\n<div class=\"note\">تجنبوا أجهزة الشحن فقط، وتأكدوا إن عليه علامة <bdi>Suica</bdi>.</div><ol>\n<li>اختاروا اللغة الإنجليزية.</li><li>اختاروا «شراء بطاقة جديدة».</li><li>اختاروا <bdi>Blank Suica</bdi>.</li>\n<li>اختاروا المبلغ.</li><li>ادفعوا بالبطاقة البنكية وأدخلوا رمزها، أو حطوا الكاش بالجهاز.</li>\n<li>استلموا البطاقة ومرّروها عند بوابة المحطة.</li></ol>", "الكهرباء والتجهيزات": "<ul>\n<li>جهزوا محوّل فيش <bdi>Type A</bdi>.</li>\n<li>كهرباء اليابان <bdi>100V</bdi>، فبعض أجهزة الشعر (مثل الاستشوار) ممكن تشتغل أضعف إذا ما كانت مصممة لها.</li>\n<li>جهزوا النت والتطبيقات على الجوال قبل السفر.</li></ul>", "البقالة اليابانية": "<p>أشياء تستاهل التجربة من البقالات (<bdi>7-Eleven</bdi> وغيرها):</p><ul>\n<li><bdi>Egg Sandwich — ساندويتش البيض</bdi></li><li><bdi>Onigiri — تونة أو سلمون</bdi></li><li><bdi>Melon Pan</bdi></li><li><bdi>7-Eleven Smoothie</bdi></li><li><bdi>Double Cream Puff</bdi></li><li><bdi>OHAYO BRULEE Ice Cream</bdi></li><li><bdi>Big Pucchin Pudding</bdi></li><li><bdi>Egg & Fermented Butter French Toast</bdi></li><li><bdi>Meiji Essel Super Cup</bdi></li><li><bdi>Choco Monaka Jumbo</bdi></li><li><bdi>Hokkaido Melon Cream Bread</bdi></li><li><bdi>Tropicana Essentials Peach Blend</bdi></li><li><bdi>Jagabee</bdi></li><li><bdi>Chilled Moist Baumkuchen</bdi></li><li><bdi>Yukimi Daifuku</bdi></li><li><bdi>Pancakes with Maple Syrup & Margarine</bdi></li><li><bdi>Jagarico Salad</bdi></li></ul>\n<div class=\"note\">السموذي: كوب فواكه مجمدة تحطونه بماكينة الـ<bdi>Smoothie</bdi> داخل الفرع. وتأكدوا من الحلال بتطبيق <bdi>Halal Gourmet Japan</bdi>.</div>"};
    function openModal(title) {
      document.getElementById('modalTitle').innerHTML = title.replace(/و(eSIM|Suica)/, 'و&#8239;<bdi>$1</bdi>');
      const body = document.querySelector('.modal-body');
      body.innerHTML = SECTIONS[title] || 'ستُضاف معلومات هذا القسم هنا';
      body.classList.toggle('filled', !!SECTIONS[title]);
      body.scrollTop = 0;
      document.getElementById('modalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'modalOverlay') {
        closeModal();
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    });
  </script>
</body>
</html>
